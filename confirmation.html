  <body>
    <div class="topbar">

    <script>
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('order_id');
      const node = document.getElementById('confirmation-order-id');
      if (node) {
        node.textContent = orderId || 'Non disponible';
